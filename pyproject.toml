[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "catchment"
version = "0.1.0"
description = "Personal content-intelligence pipeline: ingest, extract, classify into a dynamic tag graph."
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36",
    "alembic>=1.14",
    "psycopg[binary]>=3.2",
    "pgvector>=0.3.6",
    "rq>=2.0",
    "redis>=5.2",
    "httpx>=0.28",
    # Pinned to v2 to match the langfuse/langfuse:2 server in docker-compose.
    # The v3+ SDK posts OTLP to an endpoint a v2 server does not expose, and
    # fails silently: auth_check passes while nothing is ingested.
    "langfuse>=2.53,<3",
    "groq>=1.6",
]

[project.scripts]
catchment-worker = "catchment.worker:main"
catchment-poll-email = "catchment.jobs.polling:main"

[project.optional-dependencies]
# Heavy model runtimes are opt-in so the core package and test suite stay
# installable (and fast) without CUDA/Paddle wheels.
extraction = [
    "faster-whisper>=1.1",
    "paddleocr>=2.9",
    "trafilatura>=2.0",
]
embedding = [
    "FlagEmbedding>=1.3",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=6.0",
    "mypy>=1.13",
    "ruff>=0.8",
    "types-redis>=4.6",
]

[tool.hatch.build.targets.wheel]
packages = ["catchment"]

[tool.pytest.ini_options]
testpaths = ["catchment/tests"]
# Makes the repo root importable so tests can reach `tools/` (a script
# directory, deliberately not an installed package).
pythonpath = ["."]
markers = [
    "integration: requires a live Postgres with pgvector (set CATCHMENT_TEST_DATABASE_URL)",
]
filterwarnings = ["error::DeprecationWarning:catchment.*"]

[tool.coverage.run]
source = ["catchment"]
omit = ["catchment/tests/*", "catchment/storage/migrations/*"]

[tool.coverage.report]
# Lives here rather than only in the CI command so local runs enforce the same bar.
fail_under = 80

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
exclude = ["^catchment/storage/migrations/versions/"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "rq.*", "langfuse.*"]
ignore_missing_imports = true

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "ANN", "S", "T20"]
ignore = ["ANN401"]

[tool.ruff.lint.flake8-bugbear]
# `Depends(...)` in a parameter default is the FastAPI idiom, not a mutable default.
extend-immutable-calls = [
    "fastapi.Body",
    "fastapi.Depends",
    "fastapi.Header",
    "fastapi.Path",
    "fastapi.Query",
]

[tool.ruff.lint.per-file-ignores]
# Tests assert on fake credentials and use seeded `random` for deterministic fixtures.
"catchment/tests/*" = ["S101", "S105", "S106", "S311", "ANN"]
